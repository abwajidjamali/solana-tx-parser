[package]
name = "solana-tx-parser"
version = "0.1.0"
edition = "2024"
description = "A terminal tool to fetch and parse raw Solana transactions via RPC"
repository = "https://github.com/abwajidjamali/solana-tx-parser"

[dependencies]
solana-client = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
clap = { version = "4", features = ["derive"] }
bs58 = "0.5"